opening_range_minutes: 30
session_start_et: "09:30"
session_end_et: "16:00"
flat_by_et: "15:55"
# Suppress new entries at or after this time (ET) — the bound is exclusive,
# so a bar timestamped exactly 12:00:00 is rejected. ORB historically does
# poorly on late-day breakouts; the opening-range follow-through is
# concentrated in the first ~2 hours. Flat signals are NOT subject to this;
# positions can still close after the cutoff.
latest_entry_et: "12:00"
# Number of prior regular-session high-low ranges averaged into the session-scale
# ATR used by both the OR-range filter and the stop multiplier.
atr_period_sessions: 14
atr_stop_multiplier: 1.5
take_r_multiple: 2.0
target_size_pct: 0.10
# Reject sessions where the 30-min OR is less than this fraction of the rolling
# session-ATR. Sized against the session-scale ATR (rolling mean of prior
# session high-low ranges), not a per-minute true range. Sanity check on
# NVDA/AMD/PLTR/SNOW (May 2026 sample) showed the OR/session-ATR ratio sits in
# roughly [0.37, 1.43] with median ~0.75, so 0.5 trims the bottom decile or so
# of low-conviction days without nuking the universe.
min_range_atr_multiplier: 0.5
allow_short: true
# Pre-OR proxy band — makes ORB tradeable during the 09:30–10:00 ET window
# instead of always waiting for the opening range to complete. Until 10:00 ET
# the strategy uses a proxy range built from the prior session:
#   upper_edge = prior_close + pre_or_k * prior_session_ATR
#   lower_edge = prior_close - pre_or_k * prior_session_ATR
# A bar that closes outside the band fires a long/short entry with the same
# ATR-based stop/take as the OR-breakout phase. After 10:00 the regular OR
# logic takes over unchanged. pre_or_k=0.5 is loose enough to fire on a
# meaningful gap-and-go move but tight enough to avoid bar-level noise on
# quiet opens; deliberately matched to min_range_atr_multiplier.
#
# Default is OFF pending a configuration / window where the proxy improves
# edge. Backtest on SPY/NVDA/AAPL/JPM (2025-12-01 to 2026-02-28) showed
# proxy-enabled profit factor 1.23 vs OR-only 1.58. Feature ships as an
# opt-in flag for further investigation.
use_prior_close_proxy: false
pre_or_k: 0.5

# Per-position trailing stop ratchet (owned by the session loop, not the
# strategy's generate_signals). When true, the session layer ratchets the
# stop upward as price moves favourably, locking in gains as the breakout
# extends. ORB defaults ON: it is an intraday momentum trade where the
# follow-through compounds within the session, and giving back accrued
# profit to the original ATR stop on a late-session reversal is the most
# common loss pattern.
enable_trailing_stop: true
