[project]
name = "trading-bot"
version = "0.1.0"
description = "Paper-first equities trading bot, used as a sandbox for Claude agent workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30.0",
    "pandas>=2.2.0",
    "pyarrow>=16",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
trading-bot = "trading_bot:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
